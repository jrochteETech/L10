services:
  l10:
    build: .
    image: ${IMAGE_NAME:-l10:latest}
    restart: unless-stopped
    pull_policy: never
    ports:
      - "${PORT:-8111}:8111"
    environment:
      PORT: "8111"
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: l10
      PGUSER: l10
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the stack environment}
      PGSSLMODE: disable
      APP_ENV: production
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    stop_grace_period: 15s
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: l10
      POSTGRES_USER: l10
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the stack environment}
    volumes:
      - l10_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U l10 -d l10"]
      interval: 5s
      timeout: 5s
      retries: 12
    stop_grace_period: 30s

volumes:
  l10_postgres:
